<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Smart Resource Intelligence & Automation Platform (SIH 2026)</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .login-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #1e40af, #3b82f6);
      padding: 32px 28px;
      text-align: center;
      color: white;
    }
    .login-body {
      padding: 32px 28px;
    }
    .badge-sih {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      font-weight: 600;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 8px;
    }
    .form-control:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    .btn-login {
      background: #2563eb;
      color: white;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      border: none;
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: #1d4ed8;
      color: white;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <div class="badge-sih">AICTE Smart India Hackathon 2026</div>
    <h3 class="fw-bold mb-1"><i class="bi bi-cpu"></i> SmartAuto Platform</h3>
    <p class="small mb-0 text-white-50">Resource Intelligence & Automation Engine</p>
  </div>

  <div class="login-body">
    {% if error %}
    <div class="alert alert-danger py-2 small mb-3">
      <i class="bi bi-exclamation-triangle-fill me-1"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('login_page') }}">
      <div class="mb-3">
        <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="username" name="username" value="admin" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="password" name="password" value="admin123" required>
        </div>
      </div>

      <div class="d-grid gap-2 mb-3">
        <button type="submit" class="btn btn-login">
          Sign In to Platform <i class="bi bi-arrow-right ms-1"></i>
        </button>
      </div>
    </form>

    <div class="p-3 bg-light rounded-3 border mt-3 text-center">
      <div class="small fw-semibold text-muted mb-1">Judge / Evaluator Quick Credentials:</div>
      <div class="small text-dark font-monospace">
        Username: <strong>admin</strong> | Password: <strong>admin123</strong>
      </div>
    </div>
  </div>
</div>

</body>
</html>
